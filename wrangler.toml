name = "bhp"
main = "src/index.js"
compatibility_date = "2026-07-01"
compatibility_flags = [ "nodejs_compat" ]

# 子请求上限由 Cloudflare 套餐决定：免费档外部请求 50 次，付费档默认 10000 次。
# 不在此处强行覆盖，避免免费档配置超过套餐上限导致部署失败。
[triggers]
crons = ["* * * * *", "0 13 * * *"] # 每天北京时间 21:00；周日同一触发器额外发送周报

# 邮件备份配置（Resend）
# 发送者必须是 Resend 已验证域名的邮箱；目前用官方测试地址 onboarding@resend.dev，
# 验证自己的域名后可改为 backup@你的域名.com
# 注意：变量名用 BHP_FROM_EMAIL（避免与 Cloudflare 后台同名变量冲突，后台变量优先于 wrangler.toml）
[vars]
BHP_FROM_EMAIL = "onboarding@resend.dev"
BACKUP_TARGET_EMAIL = "zy28341215@gmail.com"

[ai]
binding = "AI"