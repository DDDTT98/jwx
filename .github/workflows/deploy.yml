name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate embedded browser JavaScript
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('src/dialer_html.js', 'utf8');
          const scripts = [...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)];
          const inline = scripts.filter(m => !/\bsrc\s*=/.test(m[0].slice(0, m[0].indexOf('>') + 1)));
          if (!inline.length) throw new Error('No inline browser script found');
          inline.forEach((m, i) => {
            const out = `/tmp/bhp-inline-${i}.js`;
            fs.writeFileSync(out, m[1]);
            try {
              require('child_process').execFileSync(process.execPath, ['--check', out], { stdio: 'pipe', encoding: 'utf8' });
            } catch (e) {
              const detail = (e.stderr || e.stdout || e.message || String(e)).toString();
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '### Embedded JavaScript syntax error\\n\\n```text\\n' + detail + '\\n```\\n');
              process.stderr.write(detail);
              process.exit(1);
            }
          });
          console.log('Embedded browser JavaScript syntax OK');
          NODE

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Debug info
        run: |
          echo "=== Wrangler version ==="
          wrangler --version
          echo "=== Files ==="
          ls -la
          echo "=== wrangler.toml ==="
          cat wrangler.toml

      - name: Deploy to Cloudflare Workers
        run: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
