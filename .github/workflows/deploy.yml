name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bhp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate source and rendered pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check every Worker JavaScript module
        run: find src -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Validate rendered HTML and inline browser scripts
        run: node scripts/validate-html.mjs

  deploy:
    name: Deploy to Cloudflare Workers
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Debug info
        run: |
          echo "=== Wrangler version ==="
          wrangler --version
          echo "=== Files ==="
          ls -la
          echo "=== wrangler.toml ==="
          cat wrangler.toml

      - name: Deploy to Cloudflare Workers
        run: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
